name: Validate Browse2Browse Cloud
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check backend/src/server.js
          node --check backend/src/url-policy.js
      - name: Run URL policy regression tests
        run: npm test --prefix backend
      - name: Validate configuration files
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('backend/package.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'))"
