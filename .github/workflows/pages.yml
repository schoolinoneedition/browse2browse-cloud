name: Deploy Browse2Browse Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application files
        run: |
          node --check app.js
          node --check config.js
          node --check backend/src/server.js
          node -e "JSON.parse(require('node:fs').readFileSync('backend/package.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js favicon.svg manifest.webmanifest _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
